name: Documentation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docguard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run documentation guard
        run: uv run pytest
